name: Paket Desktop SIBERWASPADA AI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Paket ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: --win nsis
          - platform: macos
            os: macos-latest
            target: --mac dmg
          - platform: linux
            os: ubuntu-latest
            target: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Build bundled API service
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --name siberwaspada-api --paths backend --hidden-import app.main --collect-submodules app --collect-submodules uvicorn backend/desktop_entry.py
      - name: Stage desktop package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p desktop/web desktop/resources/backend
          cp -R frontend/dist/. desktop/web/
          cp dist/siberwaspada-api desktop/resources/backend/siberwaspada-api
          chmod +x desktop/resources/backend/siberwaspada-api
      - name: Stage desktop package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/web, desktop/resources/backend | Out-Null
          Copy-Item frontend/dist/* desktop/web/ -Recurse -Force
          Copy-Item dist/siberwaspada-api.exe desktop/resources/backend/siberwaspada-api.exe
      - name: Build installer
        working-directory: desktop
        run: |
          npm install
          npm run dist -- ${{ matrix.target }} --publish never
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siberwaspada-${{ matrix.platform }}-installer
          path: desktop/release/*
          if-no-files-found: error
      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*
